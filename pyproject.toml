[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phantester"
version = "0.1.0"
description = "Fail-closed file integrity and ransomware defense agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "cryptography>=44.0.0",
  "pydantic>=2.10.0",
  "typer>=0.15.0",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.2.0",
  "datasets>=3.2.0",
  "huggingface-hub>=0.27.0",
  "peft>=0.14.0",
  "torch>=2.5.0",
  "transformers>=4.48.0",
]
test = ["pytest>=8.3.0", "ruff>=0.9.0"]

[project.scripts]
phantester = "phantester.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/phantester"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
